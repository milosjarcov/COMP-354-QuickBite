<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
  <section class="container mt-4">
    <h1>QuickBite</h1>
    <h2 class="h4 mt-4">Restaurants</h2>
    <div id="restaurants" class="list-group">Loading...</div>
  </section>
  <section class="container mt-4">
  <h3>Available Menu Items</h3>
  <div id="menu-items"></div>
</section>
  <section class="container mt-4">
  <h3>Your Cart</h3>

  <div id="cart-items">
    <p>Your cart is empty.</p>
  </div>

  <h4>Total: $<span id="cart-total">0.00</span></h4>

  <button id="clear-cart" class="btn btn-outline-danger">
    Clear Cart
  </button>

<h3 class="mt-4">Select Pickup Time</h3>

<label for="pickup-time" class="form-label">
  Pickup time:
</label>

<select id="pickup-time" class="form-select" required></select>

<p id="selected-pickup-time" class="mt-2">
  No pickup time selected.
</p>
</section>
  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/cartUI.js"></script>
  <script type="module" src="js/menuCart.js"></script>
  <script type="module">
  import { setupPickupTime } from "./js/pickupTime.js";
  setupPickupTime();
</script>
</body>
